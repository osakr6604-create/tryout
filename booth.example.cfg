; Booth settings for Tryout.
;
; Copy this file to "booth.cfg" next to Tryout.exe and change what you need.
; Every line is optional. Anything changed in the booth menu (F1) is saved
; separately in the user folder and is read first; this file wins over it.

[booth]

; Shown on the attract screen and on the leaderboard screen.
event_name="Spring Finals"

; Your logo, shown in a corner of the attract screen and the leaderboard.
; A PNG or JPG file next to Tryout.exe. A wide logo on a transparent background works best.
;logo="logo.png"

; Seconds the scouting report stays up before the game resets for the next player.
idle_seconds=25

; true hides Quit in the booth menu.
kiosk=true

; The QR code on the report links here. Leave as it is to use the public card page,
; point it at your own page, or set show_qr to false to hide the code.
card_url="https://osakr6604-create.github.io/tryout/card/"
show_qr=true

[display]

fullscreen=true

; -1 puts the leaderboard on the second screen when there is one.
; -2 never opens it. 0, 1, 2 pick a screen by number.
board_screen=-1

; true turns V-Sync off and raises the frame cap, which tightens the reaction
; times by a few milliseconds on a fast monitor.
low_latency=false

[audio]

master=0.9
music=0.5

[theme]

; The lead colour, as a hex code. The default is sky blue.
accent="#2EC5FF"
